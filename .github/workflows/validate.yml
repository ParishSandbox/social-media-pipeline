name: Validate posts

on:
  pull_request:
  push:
    branches: [main]
    paths: [content/**, scripts/**, test/**, config/**, package*.json]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/validate-posts.mjs
